apiVersion: apps/v1
kind: Deployment
metadata:
  name: ames-housing
  labels:
    app: ames-housing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ames-housing
  template:
    metadata:
      labels:
        app: ames-housing
    spec:
      containers:
        - name: ames-housing
          image: ames-housing:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9696
          readinessProbe:
            httpGet:
              path: /health
              port: 9696
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 9696
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
